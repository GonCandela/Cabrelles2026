<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabrelles 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --mil-dark:#1a2410;
    --mil-green:#2d4a1e;
    --mil-mid:#3d6128;
    --mil-light:#5a8a3a;
    --mil-accent:#8ab84a;
    --mil-gold:#c9a84c;
    --mil-gold-light:#e8c96a;
    --bg:#f5f5f2;
    --card:#ffffff;
    --border:#e0ddd5;
    --text:#1a1a1a;
    --text2:#666;
    --text3:#999;
  }
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;}
  .container{max-width:720px;margin:0 auto;padding:1rem;}

  .hero{background:var(--mil-dark);border-radius:14px;padding:1.5rem;margin-bottom:1rem;border:1px solid #3d6128;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.8rem;}
  .live-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:0.1em;color:var(--mil-accent);background:rgba(90,138,58,0.15);padding:3px 10px;border-radius:20px;border:1px solid var(--mil-mid);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--mil-accent);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .hero-title{text-align:center;margin-bottom:0.8rem;}
  .hero-title h1{font-size:26px;font-weight:600;color:var(--mil-gold);letter-spacing:0.12em;}
  .hero-title .sub{font-size:11px;letter-spacing:0.25em;color:var(--mil-accent);margin-top:4px;}
  .hero-divider{border:none;border-top:1px solid var(--mil-mid);margin:0.8rem 0;}
  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .hstat{text-align:center;}
  .hstat-val{font-size:22px;font-weight:600;color:var(--mil-gold-light);}
  .hstat-label{font-size:10px;letter-spacing:0.15em;color:var(--mil-accent);margin-top:2px;}

  .lock-btn{background:rgba(90,138,58,0.15);border:1px solid var(--mil-mid);color:var(--mil-accent);padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;letter-spacing:0.08em;transition:all 0.15s;white-space:nowrap;}
  .lock-btn:hover{background:rgba(90,138,58,0.3);}
  .lock-btn.unlocked{color:var(--mil-gold);border-color:var(--mil-gold);background:rgba(201,168,76,0.15);}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);border-radius:14px;padding:1.5rem;width:100%;max-width:340px;margin:1rem;}
  .modal h3{font-size:16px;font-weight:600;margin-bottom:0.5rem;color:var(--text);}
  .modal p{font-size:13px;color:var(--text2);margin-bottom:1rem;}
  .modal input[type=password]{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--border);border-radius:8px;margin-bottom:0.75rem;color:var(--text);background:var(--bg);}
  .modal input[type=password]:focus{outline:none;border-color:var(--mil-light);}
  .modal-btns{display:flex;gap:8px;}
  .modal-btns button{flex:1;padding:9px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all 0.15s;}
  .btn-confirm{background:var(--mil-green);color:#e8f5d8;border:1px solid var(--mil-mid);}
  .btn-confirm:hover{background:var(--mil-mid);}
  .btn-cancel{background:none;color:var(--text2);border:1px solid var(--border);}
  .btn-cancel:hover{background:var(--bg);}
  .modal-error{font-size:12px;color:#c0392b;margin-bottom:0.5rem;display:none;}

  .nav{display:flex;gap:0;margin-bottom:1rem;background:#e8e6e0;border-radius:10px;padding:3px;border:1px solid var(--border);}
  .nav-btn{flex:1;padding:9px 6px;font-size:13px;font-weight:500;letter-spacing:0.04em;cursor:pointer;border:none;background:none;border-radius:8px;color:var(--text2);transition:all 0.15s;}
  .nav-btn.active{background:var(--mil-green);color:#e8f5d8;}
  .nav-btn:hover:not(.active):not(:disabled){background:rgba(0,0,0,0.06);}
  .nav-btn:disabled{opacity:0.35;cursor:not-allowed;}

  .panel{display:none;}.panel.active{display:block;}

  .podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:10px;margin-bottom:1.2rem;align-items:end;}
  .podium-card{border-radius:10px;padding:14px 10px 12px;text-align:center;background:var(--card);border:1px solid var(--border);}
  .podium-card.p1{border:2px solid var(--mil-gold);background:#fffbf0;padding-top:24px;padding-bottom:18px;}
  .podium-card.p2{border:2px solid #b0b0b0;background:#fafafa;padding-top:16px;}
  .podium-card.p3{border:2px solid #a07830;background:#fdf8f0;}
  .podium-rank{font-weight:700;margin-bottom:6px;line-height:1;}
  .podium-card.p1 .podium-rank{font-size:36px;color:var(--mil-gold);}
  .podium-card.p2 .podium-rank{color:#909090;font-size:26px;}
  .podium-card.p3 .podium-rank{color:#a07830;font-size:24px;}
  .podium-name{font-size:16px;font-weight:600;color:var(--text);}
  .podium-card.p1 .podium-name{font-size:20px;}
  .podium-score{font-size:28px;font-weight:700;margin-top:4px;}
  .podium-card.p1 .podium-score{font-size:34px;color:var(--mil-gold);}
  .podium-card.p2 .podium-score{color:#707070;font-size:26px;}
  .podium-card.p3 .podium-score{color:#a07830;font-size:22px;}
  .podium-label{font-size:10px;letter-spacing:0.12em;margin-top:3px;font-weight:600;text-transform:uppercase;}
  .podium-card.p1 .podium-label{color:var(--mil-gold);}
  .podium-card.p2 .podium-label{color:#909090;}
  .podium-card.p3 .podium-label{color:#a07830;}
  .podium-pruebas{font-size:11px;color:var(--text3);margin-top:6px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;}
  .filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:0.75rem;flex-wrap:wrap;}
  .filter-bar label{font-size:13px;color:var(--text2);}
  .filter-bar select{font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{font-size:10px;letter-spacing:0.1em;color:var(--text2);padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600;text-align:left;}
  thead th.num{text-align:right;}
  tbody tr{border-bottom:1px solid #f0ede8;transition:background 0.1s;}
  tbody tr:hover{background:#f9f8f5;}
  tbody td{padding:9px 8px;color:var(--text);}
  td.pos{text-align:center;width:36px;font-weight:600;}
  td.seccion{font-size:14px;font-weight:600;}
  td.pts{text-align:right;font-size:15px;font-weight:700;width:60px;}

  .prog-wrap{display:flex;align-items:center;gap:5px;}
  .prog-dots{display:flex;gap:2px;}
  .prog-dot{width:7px;height:7px;border-radius:50%;background:#e0ddd5;border:1px solid #ccc;flex-shrink:0;}
  .prog-dot.done{background:var(--mil-mid);border-color:var(--mil-mid);}
  .prog-dot.done.top{background:var(--mil-gold);border-color:var(--mil-gold);}
  .prog-count{font-size:10px;color:var(--text3);white-space:nowrap;}

  .score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:1rem;}
  .score-item{background:#f9f8f5;border-radius:8px;padding:8px 10px;border:1px solid var(--border);transition:border-color 0.15s;}
  .score-item.has-val{border-color:rgba(61,97,40,0.5);background:#f0f7e8;}
  .score-item.dirty{border-color:#c9a84c;background:#fffbf0;}
  .score-item-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;}
  .score-item input{width:100%;font-size:16px;font-weight:600;text-align:center;border:1px solid var(--border);border-radius:6px;background:white;color:var(--text);padding:5px 4px;-moz-appearance:textfield;}
  .score-item input:disabled{background:#f0ede8;color:#aaa;cursor:not-allowed;}
  .score-item input::-webkit-outer-spin-button,.score-item input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .score-item input:focus{outline:none;border-color:var(--mil-light);}

  .action-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .mil-btn{padding:10px 24px;font-size:14px;font-weight:600;letter-spacing:0.06em;border:1px solid var(--mil-mid);background:var(--mil-green);color:#e8f5d8;border-radius:9px;cursor:pointer;transition:all 0.15s;}
  .mil-btn:hover{background:var(--mil-mid);}
  .mil-btn:active{transform:scale(0.98);}
  .save-status{font-size:12px;color:var(--text3);}
  .readonly-notice{background:#f5f3ee;border:1px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--text2);margin-bottom:1rem;text-align:center;}
  .error-box{background:#fff3f3;border:1px solid #f5c0c0;border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:13px;color:#a33;}
  .prueba-info{font-size:12px;color:var(--mil-mid);background:#f0f7e8;border:1px solid rgba(61,97,40,0.2);border-radius:6px;padding:6px 12px;margin-bottom:0.75rem;}
</style>
</head>
<body>
<div class="container">

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Acceso de editor</h3>
      <p>Introduce la contraseña para editar las puntuaciones.</p>
      <input type="password" id="passInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter') checkPass()"/>
      <div class="modal-error" id="passError">Contraseña incorrecta</div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-confirm" onclick="checkPass()">Entrar</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-top">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <polygon points="24,4 27.5,14.5 38.5,14.5 29.5,21 33,31.5 24,25 15,31.5 18.5,21 9.5,14.5 20.5,14.5" fill="#c9a84c" opacity="0.9"/>
          <circle cx="24" cy="35" r="7" fill="none" stroke="#5a8a3a" stroke-width="1.5"/>
          <line x1="24" y1="28" x2="24" y2="42" stroke="#5a8a3a" stroke-width="1"/>
          <line x1="17" y1="35" x2="31" y2="35" stroke="#5a8a3a" stroke-width="1"/>
        </svg>
        <div class="live-badge"><span class="dot"></span><span id="connStatus">Conectando...</span></div>
      </div>
      <button class="lock-btn" id="lockBtn" onclick="toggleLock()">🔒 Editor</button>
    </div>
    <div class="hero-title">
      <h1>Cabrelles 2026</h1>
      <div class="sub">Clasificación general</div>
    </div>
    <hr class="hero-divider">
    <div class="hero-stats">
      <div class="hstat"><div class="hstat-val">30</div><div class="hstat-label">Secciones</div></div>
      <div class="hstat"><div class="hstat-val">15</div><div class="hstat-label">Pruebas</div></div>
      <div class="hstat"><div class="hstat-val" id="heroCompleted">0</div><div class="hstat-label">Completadas</div></div>
    </div>
  </div>

  <div id="errorBox" class="error-box" style="display:none;"></div>

  <div class="nav">
    <button class="nav-btn active" id="rankTabBtn" onclick="switchTab('ranking',this)">Clasificación</button>
    <button class="nav-btn" id="editTabBtn" onclick="handleEditTab(this)" disabled>Puntuaciones</button>
  </div>

  <div id="panel-ranking" class="panel active">
    <div id="podiumEl" class="podium"></div>
    <div class="card">
      <div class="filter-bar">
        <label>Filtrar por prueba:</label>
        <select id="filterPrueba" onchange="renderRanking()">
          <option value="all">Total general</option>
        </select>
      </div>
      <table>
        <thead><tr>
          <th style="width:36px;text-align:center;">Pos.</th>
          <th>Sección</th>
          <th class="num">Puntos</th>
          <th style="width:140px;">Pruebas</th>
        </tr></thead>
        <tbody id="rankBody"><tr><td colspan="4" style="text-align:center;padding:2rem;color:#999;">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="panel-scores" class="panel">
    <div id="readonlyNotice" class="readonly-notice" style="display:none;">
      Vista de solo lectura — pulsa "🔒 Editor" para editar
    </div>
    <div class="card">
      <div class="filter-bar">
        <label>Prueba:</label>
        <select id="pruebaSel" onchange="onPruebaChange()"></select>
      </div>
      <div id="pruebaInfo" class="prueba-info" style="display:none;"></div>
      <div class="score-grid" id="scoreGrid"></div>
      <div class="action-row" id="saveRow" style="display:none;">
        <button class="mil-btn" onclick="saveAll()">Guardar prueba</button>
        <span class="save-status" id="saveStatus"></span>
      </div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const EDIT_PASSWORD = 'TRX424';

const firebaseConfig = {
  apiKey: "AIzaSyBbTX3E_oaCj1uh3FwWLzgq-x92JBS4uwM",
  authDomain: "cabrelles2026.firebaseapp.com",
  projectId: "cabrelles2026",
  storageBucket: "cabrelles2026.firebasestorage.app",
  messagingSenderId: "638796417803",
  appId: "1:638796417803:web:e591f45644a49fbe59f00e"
};

const PARTICIPANTS = ['111','112','113','114','121','122','123','124','131','132','133','134','211','212','213','221','222','223','231','232','233','61','62','63','311','312','313','321','322','323'];
const N = 15;

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, 'torneo', 'cabrelles2026');

// scores[seccion][prueba] = valor
let scores = {};
let activeTab = 'ranking';
let isEditor = false;
// pendingEdits guarda lo que el editor ha escrito pero aún no ha guardado
// pendingEdits[seccion] = valor (solo para la prueba actualmente seleccionada)
let pendingEdits = {};
let isSaving = false;

function initScores() {
  PARTICIPANTS.forEach(p => {
    scores[p] = scores[p] || {};
    for (let i = 1; i <= N; i++) {
      if (scores[p][i] === undefined) scores[p][i] = '';
    }
  });
}

function getTotal(p) {
  let t = 0;
  for (let i = 1; i <= N; i++) {
    const v = parseFloat(scores[p][i]);
    if (!isNaN(v)) t += v;
  }
  return t;
}

function getCompleted(p) {
  let c = 0;
  for (let i = 1; i <= N; i++) {
    if (scores[p][i] !== '' && !isNaN(parseFloat(scores[p][i]))) c++;
  }
  return c;
}

function getTotalCompleted() {
  let set = new Set();
  PARTICIPANTS.forEach(p => {
    for (let i = 1; i <= N; i++) {
      if (scores[p][i] !== '' && !isNaN(parseFloat(scores[p][i]))) set.add(i);
    }
  });
  return set.size;
}

function getSorted(prueba) {
  return PARTICIPANTS.map(p => {
    let val;
    if (prueba === 'all') { val = getTotal(p); }
    else { const v = parseFloat(scores[p][parseInt(prueba)]); val = isNaN(v) ? null : v; }
    return { p, val };
  }).sort((a, b) => {
    if (a.val === null && b.val === null) return 0;
    if (a.val === null) return 1;
    if (b.val === null) return -1;
    return b.val - a.val;
  });
}

function makeDots(p, isTop) {
  const c = getCompleted(p);
  let dots = '';
  for (let i = 0; i < N; i++) {
    const done = i < c;
    dots += `<div class="prog-dot${done ? ' done' : ''}${done && isTop ? ' top' : ''}"></div>`;
  }
  return `<div class="prog-wrap"><div class="prog-dots">${dots}</div><span class="prog-count">${c}/${N}</span></div>`;
}

function renderPodium(sorted) {
  const el = document.getElementById('podiumEl');
  const top3 = sorted.filter(d => d.val !== null).slice(0, 3);
  if (top3.length < 1) { el.innerHTML = ''; return; }
  const configs = [
    { cls: 'p1', rank: '1.°', label: 'Primero' },
    { cls: 'p2', rank: '2.°', label: 'Segundo' },
    { cls: 'p3', rank: '3.°', label: 'Tercero' },
  ];
  const order = [1, 0, 2];
  el.innerHTML = order.map(i => {
    const d = top3[i];
    if (!d) return '<div></div>';
    const cfg = configs[i];
    return `<div class="podium-card ${cfg.cls}">
      <div class="podium-rank">${cfg.rank}</div>
      <div class="podium-name">${d.p}</div>
      <div class="podium-score">${Math.round(d.val)}</div>
      <div class="podium-label">${cfg.label}</div>
      <div class="podium-pruebas">${getCompleted(d.p)}/${N} pruebas</div>
    </div>`;
  }).join('');
}

function renderRanking() {
  const prueba = document.getElementById('filterPrueba').value;
  const sorted = getSorted(prueba);
  const rankSymbols = ['★', '✦', '◆'];
  const rankColors = ['#c9a84c', '#909090', '#a07830'];
  document.getElementById('rankBody').innerHTML = sorted.map((d, i) => {
    const isNull = d.val === null;
    const pts = isNull ? '—' : Math.round(d.val);
    const isTop = !isNull && i < 3;
    const posHtml = isTop
      ? `<span style="color:${rankColors[i]};font-size:16px;">${rankSymbols[i]}</span>`
      : `<span style="font-size:13px;">${isNull ? '—' : i + 1}</span>`;
    const dotsHtml = prueba === 'all' ? makeDots(d.p, isTop) : `<span style="font-size:12px;color:#999;">—</span>`;
    return `<tr>
      <td class="pos">${posHtml}</td>
      <td class="seccion">${d.p}</td>
      <td class="pts">${pts}</td>
      <td class="prog">${dotsHtml}</td>
    </tr>`;
  }).join('');
  renderPodium(sorted);
  document.getElementById('heroCompleted').textContent = getTotalCompleted();
}

function getCurrentPrueba() {
  return parseInt(document.getElementById('pruebaSel').value);
}

// Renderiza el grid SIN tocar los pendingEdits del editor
function renderScoreGrid() {
  const prueba = getCurrentPrueba();
  const grid = document.getElementById('scoreGrid');

  // Mostrar info de la prueba actual
  const infoEl = document.getElementById('pruebaInfo');
  const completedInPrueba = PARTICIPANTS.filter(p => scores[p][prueba] !== '' && !isNaN(parseFloat(scores[p][prueba]))).length;
  infoEl.textContent = `Prueba ${prueba} — ${completedInPrueba} de 30 secciones con puntuación`;
  infoEl.style.display = 'block';

  grid.innerHTML = PARTICIPANTS.map(p => {
    // Si hay un pendingEdit para esta sección, mostrarlo; si no, el valor guardado
    const savedVal = scores[p][prueba] !== undefined ? scores[p][prueba] : '';
    const displayVal = pendingEdits.hasOwnProperty(p) ? pendingEdits[p] : savedVal;
    const hasVal = displayVal !== '' && displayVal !== null;
    const isDirty = pendingEdits.hasOwnProperty(p) && pendingEdits[p] !== savedVal;

    return `<div class="score-item${hasVal ? ' has-val' : ''}${isDirty ? ' dirty' : ''}" id="item_${p}">
      <div class="score-item-label">${p}</div>
      <input type="number" value="${displayVal}" placeholder="—" id="inp_${p}"
        step="any" ${isEditor ? '' : 'disabled'}
        oninput="window._onInput('${p}', this.value)"/>
    </div>`;
  }).join('');

  document.getElementById('readonlyNotice').style.display = isEditor ? 'none' : 'block';
  document.getElementById('saveRow').style.display = isEditor ? 'flex' : 'none';
}

// Cuando el editor escribe, solo guarda en pendingEdits (no toca scores)
window._onInput = function(p, val) {
  if (!isEditor) return;
  pendingEdits[p] = val;
  const prueba = getCurrentPrueba();
  const savedVal = scores[p][prueba] !== undefined ? scores[p][prueba] : '';
  const item = document.getElementById(`item_${p}`);
  const hasVal = val !== '';
  const isDirty = val !== savedVal;
  item.className = `score-item${hasVal ? ' has-val' : ''}${isDirty ? ' dirty' : ''}`;
};

// Cuando cambia de prueba, resetea pendingEdits
window.onPruebaChange = function() {
  pendingEdits = {};
  document.getElementById('saveStatus').textContent = '';
  renderScoreGrid();
};

window.saveAll = async function() {
  if (!isEditor || isSaving) return;
  isSaving = true;
  const prueba = getCurrentPrueba();
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Guardando...';

  // Aplicar pendingEdits a scores solo para esta prueba
  PARTICIPANTS.forEach(p => {
    if (pendingEdits.hasOwnProperty(p)) {
      scores[p][prueba] = pendingEdits[p];
    }
  });

  try {
    await setDoc(docRef, { scores });
    pendingEdits = {}; // Limpiar pendientes tras guardar
    statusEl.textContent = 'Guardado · ' + new Date().toLocaleTimeString('es-ES');
    renderScoreGrid(); // Redibujar sin dirty marks
  } catch(e) {
    statusEl.textContent = 'Error: ' + e.message;
    // Revertir scores si falla
    PARTICIPANTS.forEach(p => {
      if (pendingEdits.hasOwnProperty(p)) {
        // pendingEdits sigue intacto, el usuario puede reintentar
      }
    });
  } finally {
    isSaving = false;
  }
};

window.switchTab = function(tab, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  activeTab = tab;
  if (tab === 'ranking') renderRanking();
  if (tab === 'scores') { pendingEdits = {}; renderScoreGrid(); }
};

window.handleEditTab = function(btn) {
  if (!isEditor) { openModal(); return; }
  window.switchTab('scores', btn);
};

window.toggleLock = function() {
  if (isEditor) {
    isEditor = false;
    pendingEdits = {};
    updateLockUI();
    window.switchTab('ranking', document.getElementById('rankTabBtn'));
  } else {
    openModal();
  }
};

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('passInput').value = '';
  document.getElementById('passError').style.display = 'none';
  setTimeout(() => document.getElementById('passInput').focus(), 100);
}

window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('open');
};

window.checkPass = function() {
  const val = document.getElementById('passInput').value;
  if (val === EDIT_PASSWORD) {
    isEditor = true;
    updateLockUI();
    window.closeModal();
    const editBtn = document.getElementById('editTabBtn');
    window.switchTab('scores', editBtn);
  } else {
    document.getElementById('passError').style.display = 'block';
    document.getElementById('passInput').value = '';
    document.getElementById('passInput').focus();
  }
};

function updateLockUI() {
  const btn = document.getElementById('lockBtn');
  const editTab = document.getElementById('editTabBtn');
  if (isEditor) {
    btn.textContent = '🔓 Editor';
    btn.classList.add('unlocked');
    editTab.disabled = false;
  } else {
    btn.textContent = '🔒 Editor';
    btn.classList.remove('unlocked');
    editTab.disabled = true;
  }
}

async function init() {
  const ps = document.getElementById('pruebaSel');
  const fp = document.getElementById('filterPrueba');
  for (let i = 1; i <= N; i++) {
    ps.innerHTML += `<option value="${i}">Prueba ${i}</option>`;
    fp.innerHTML += `<option value="${i}">Prueba ${i}</option>`;
  }

  try {
    onSnapshot(docRef, (snap) => {
      if (snap.exists()) scores = snap.data().scores || {};
      initScores();
      document.getElementById('connStatus').textContent = 'En directo';

      if (activeTab === 'ranking') {
        renderRanking();
      } else if (activeTab === 'scores') {
        // Solo actualiza el grid si NO hay ediciones pendientes sin guardar
        // para no sobreescribir lo que el editor está escribiendo
        const hasPending = Object.keys(pendingEdits).length > 0;
        if (!hasPending) {
          renderScoreGrid();
        }
        // Siempre actualizar el ranking aunque no se muestre
      }
      document.getElementById('heroCompleted').textContent = getTotalCompleted();
    }, (err) => {
      document.getElementById('connStatus').textContent = 'Sin conexión';
      document.getElementById('errorBox').textContent = 'Error de conexión: ' + err.message;
      document.getElementById('errorBox').style.display = 'block';
    });
  } catch(e) {
    document.getElementById('errorBox').textContent = 'Error al iniciar: ' + e.message;
    document.getElementById('errorBox').style.display = 'block';
  }
}

init();
</script>
